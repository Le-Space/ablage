# Dependabot, for helia only.
#
# The reason it exists: ablage patches @helia/bitswap (patches/, applied by
# patch-package on every install) for a bug that was fixed upstream in
# ipfs/helia#1129 and has not been released yet. This watches npm so that
# nobody has to, and says so with a pull request when a new helia arrives.
#
# What to expect from it:
#
# - The pull request that brings the fixed @helia/bitswap will fail CI, and
#   that is the signal rather than a fault. `npm ci` runs patch-package, and
#   the local patch does not apply to a bitswap that already has the fix
#   (checked against 4.0.16-0d5e5015, which does). Finishing it means deleting
#   the patch and adjusting test/browser/bitswap-gate.test.js - see #99.
# - Every pull request it opens runs the whole browser suite, and it rebases
#   after every merge to main, because the version hook changes package.json.
# - Nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/Berlin
    # Only helia. Without this it opens a pull request for every dependency
    # that has a newer version.
    allow:
      - dependency-name: helia
      - dependency-name: "@helia/*"
    # One pull request for all of them: helia and its packages are released
    # together, and one bumped without the others is a tree with two copies.
    groups:
      helia:
        patterns:
          - helia
          - "@helia/*"
    # Major versions by hand. The first one waiting is @helia/libp2p 1 → 2:
    # ablage asks for ^1.0.8, while helia itself already uses 2.x.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
