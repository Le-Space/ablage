# Build and publish to Aleph IPFS.
#
# Modelled on the workflow in libp2p-webrtc-qr, which has been publishing this
# way for months - copied rather than reinvented, including the retry and the
# note about which gateway to hand somebody.
#
# The tests gate the deploy. A folder-sync app that ships broken syncs somebody's
# files wrongly, which is worse than not shipping.
name: Build & Deploy to Aleph IPFS

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      link_domain:
        description: >-
          Point the custom domain at this build. Off by default so a run from a
          branch cannot take over what people are using - the CID this publishes
          is enough to test with.
        type: boolean
        required: false
        default: false
      domain:
        description: >-
          Aleph custom domain to link (e.g. ablage.le-space.de). Leave empty for
          the default below.
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Must match `@playwright/test` in package.json. The image ships the
      # browsers for exactly its own version, and a mismatch does not say so:
      # Firefox simply is not where the runner looks, and every Firefox test
      # fails with an executable-not-found that reads like a broken container.
      # The step below turns that into a sentence.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    env:
      # Firefox refuses to start when $HOME is not owned by the current user,
      # which is the case for the default HOME inside this container. Playwright
      # names this fix in its own launch error.
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The image has to match the dependency
        shell: bash
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          image="$(npx playwright --version | awk '{print $2}')"

          if [ "$installed" != "$image" ]; then
            echo "::error::@playwright/test is $installed but this container ships browsers for $image. Update the image tag in this workflow to v$installed-noble."
            exit 1
          fi

          echo "Playwright $installed, browsers to match."

      - run: npm run test:unit

      # The container ships the browsers, so both engines run without an install.
      - run: npx playwright test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      cid: ${{ steps.publish.outputs.ipfs_cid }}
      cid_v0: ${{ steps.publish.outputs.ipfs_cid_v0 }}
      item_hash: ${{ steps.publish.outputs.item_hash }}
      store_processed: ${{ steps.publish.outputs.store_processed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vite build

      - name: Install isolated Aleph deploy tooling
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.22

      - name: Publish to Aleph IPFS
        id: publish
        env:
          ALEPH_VM_MODE: site-publish
          ALEPH_SITE_DIRECTORY: ${{ github.workspace }}/dist
          ALEPH_SITE_PIN: 'true'
          ALEPH_SITE_NAME: ablage
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Aleph publish attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done

      - name: Say where it is
        if: steps.publish.outputs.ipfs_cid != ''
        env:
          CID: ${{ steps.publish.outputs.ipfs_cid }}
        run: |
          {
            echo '## Published'
            echo
            echo "**IPFS CID:** ${CID}"
            echo
            echo "**Open it here:** https://ipfs.aleph.cloud/ipfs/${CID}/"
            echo
            echo "Alternative: https://${CID}.ipfs.dweb.link/"
            echo
            echo 'Not ipfs.public.aleph.sh - it serves an incomplete certificate chain for'
            echo 'its own name, so it fails outside a browser.'
            echo
            echo 'Both of the above are HTTPS, which this app needs: the camera, the origin'
            echo 'private filesystem and the share sheet are all unavailable over plain HTTP.'
            echo
            echo 'Invite links made there point back to the same gateway path, so the second'
            echo 'phone lands on the same build.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Pointing the domain at what was just published. A separate job because it is
  # a separate decision: publishing is always safe - a new CID takes nothing
  # away - while moving the domain replaces what people have open.
  link-domain:
    needs: deploy
    # The domain follows main. A dispatch has to ask for it, so a run from a
    # branch cannot silently replace what is live.
    #
    # `store_processed` is the gate that matters: Aleph accepts the store
    # message before the content is available, and linking a domain to a CID
    # that has not landed yet points people at nothing.
    if: >-
      (github.ref == 'refs/heads/main' || inputs.link_domain) &&
      needs.deploy.outputs.item_hash != '' &&
      needs.deploy.outputs.store_processed == 'true'
    runs-on: ubuntu-latest
    env:
      ABLAGE_DOMAIN: ablage.le-space.de
    steps:
      - uses: actions/checkout@v4

      - name: Install isolated Aleph deploy tooling
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.22

      - name: Link the custom domain
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_ITEM_HASH: ${{ needs.deploy.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ needs.deploy.outputs.cid }}
          ALEPH_SITE_IPFS_CID_V0: ${{ needs.deploy.outputs.cid_v0 }}
          ALEPH_SITE_DOMAIN: ${{ inputs.domain || env.ABLAGE_DOMAIN }}
          # Every path serves index.html: an invite link carries its payload in
          # the fragment, and the second phone opening one must not meet a 404
          # from the gateway before the page can read it.
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: /index.html
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"

      - name: Say where it is
        env:
          DOMAIN: ${{ inputs.domain || env.ABLAGE_DOMAIN }}
          CID: ${{ needs.deploy.outputs.cid }}
        run: |
          {
            echo '## Linked'
            echo
            echo "**Live:** https://${DOMAIN}"
            echo
            echo "**IPFS CID:** \`${CID}\`"
            echo
            echo 'A domain that has just been created can take a few minutes before its'
            echo 'certificate is issued. Until then the gateway link above still works.'
          } >> "$GITHUB_STEP_SUMMARY"
