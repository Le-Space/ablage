<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ablage</title>
    <link rel="stylesheet" href="./src/app/style.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <h1 data-i18n="page.title">ablage</h1>
        <label class="locale">
          <span class="visually-hidden" id="locale-label">Language</span>
          <select id="locale" aria-labelledby="locale-label">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
      </header>
      <p class="lede" data-i18n="page.lede">
        A folder that stays the same on two devices. No account, nothing in the middle.
      </p>

      <section class="card">
        <h2 data-i18n="link.heading">This device and the other one</h2>

        <!--
          "Not connected yet" rather than "out of sync". Two devices that have
          never met are not in disagreement, and saying so would make the first
          question "why does it say pending".
        -->
        <p id="link-state" class="state is-idle" data-i18n="link.idle">Not connected yet.</p>

        <div class="actions">
          <button id="invite" class="primary" type="button" data-i18n="link.invite">Show my code</button>
          <button id="scan" type="button" data-i18n="link.scan">Scan their code</button>
        </div>

        <details class="fold">
          <summary data-i18n="link.fold">Or send it as a link</summary>
          <div class="row">
            <input id="invite-link" type="text" readonly aria-label="Invite link" />
            <button id="copy" type="button" data-i18n="link.copy">Copy</button>
          </div>
        </details>

        <qr-status id="network" rows="ipv4 ipv6 overall" hidden></qr-status>
      </section>

      <section class="card">
        <h2 data-i18n="files.heading">Files</h2>

        <p id="folder" class="hint"></p>
        <!--
          Hidden where there is no picker at all, which is Firefox and WebKit -
          a control that cannot do anything is worse than its absence.
        -->
        <button id="pick-folder" type="button" hidden data-i18n="folder.choose">Choose a folder</button>

        <div id="drop" class="drop">
          <label for="pick"><span data-i18n="files.drop">Drop files or a folder here, or </span><span class="link" data-i18n="files.choose">choose them</span></label>
          <input id="pick" type="file" multiple />
        </div>

        <ul id="files" class="files tree"></ul>
        <p id="files-empty" class="hint" data-i18n="files.empty">Nothing here yet.</p>
      </section>

      <dialog id="invite-box" class="modal">
        <div class="modal-head">
          <h3 data-i18n="link.modalTitle">Show this to the other device</h3>
          <button class="close" data-close type="button" aria-label="Close">&times;</button>
        </div>
        <qr-invite id="code"></qr-invite>
        <p class="hint" data-i18n="link.cameraHint">Their camera opens the same link — or send it to them.</p>
        <div class="actions">
          <button id="scan-reply" class="primary" type="button" data-i18n="link.scanReply">Scan their reply</button>
        </div>
      </dialog>

      <!--
        Shown once, on a first visit, and never to somebody who arrived by
        invite - that person came to accept something, and a dialog stands in
        front of the only thing they came for. The caveats and the live network
        verdict come from the element; the slot is this app's own story.
      -->
      <qr-intro id="intro">
        <p data-i18n="intro.what"></p>
        <p data-i18n="intro.how"></p>
        <p data-i18n="intro.who"></p>
      </qr-intro>

      <qr-scanner id="scanner"></qr-scanner>
    </main>

    <script type="module" src="./src/app/main.js"></script>
  </body>
</html>
