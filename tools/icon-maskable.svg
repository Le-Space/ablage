<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    The maskable variant. Android crops this to whatever shape the launcher
    uses - a circle, a squircle, a rounded square - and only the middle 80% is
    guaranteed to survive. So the mark sits inside that safe zone with the
    background carried to the edges, rather than being scaled to fill.
  -->
  <rect width="512" height="512" fill="#0b0e15" />
  <g transform="translate(128, 128) scale(2.67)">
    <path d="M8 34 h20 l6 8 h22 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-48 a4 4 0 0 1 -4 -4 v-34 a4 4 0 0 1 4 -4 z" fill="#FF6B5B" />
    <path d="M56 22 h14 l4 6 h14 a3 3 0 0 1 3 3 v20 a3 3 0 0 1 -3 3 h-32 a3 3 0 0 1 -3 -3 v-26 a3 3 0 0 1 3 -3 z"
          fill="none" stroke="#58C7F3" stroke-width="5" stroke-linejoin="round" />
    <line x1="52" y1="60" x2="70" y2="60" stroke="#58C7F3" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 8" />
  </g>
</svg>
